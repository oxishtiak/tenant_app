services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: tenantapp
      POSTGRES_USER: tenantapp
      POSTGRES_PASSWORD: tenantapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  web:
    build: .
    command: sh -c "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: tenantapp
      POSTGRES_USER: tenantapp
      POSTGRES_PASSWORD: tenantapp
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: dev-insecure-secret-key
    depends_on:
      - db

volumes:
  pgdata:
